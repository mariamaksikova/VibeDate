services:
  db:
    image: postgres:16
    container_name: vibedate-db
    restart: always
    environment:
      POSTGRES_DB: vibedate
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docs/vibedatebd.sql:/docker-entrypoint-initdb.d/01_init.sql:ro

  redis:
    image: redis:7-alpine
    container_name: vibedate-redis
    restart: always
    ports:
      - "6379:6379"

  minio:
    image: minio/minio
    container_name: vibedate-minio
    command: server /data --console-address ":9001"
    restart: always
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  app:
    build: .
    container_name: vibedate-app
    restart: always
    env_file: .env
    depends_on:
      - db
      - redis
      - minio
    volumes:
      - .:/workspace
    command: python -m app.main

volumes:
  postgres_data:
  minio_data:
