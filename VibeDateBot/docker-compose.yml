services:
  db:
    image: postgres:16
    container_name: vibedate-db
    restart: always
    environment:
      POSTGRES_DB: vibedate
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docs/vibedatebd.sql:/docker-entrypoint-initdb.d/01_init.sql:ro

  redis:
    image: redis:7-alpine
    container_name: vibedate-redis
    restart: always
    ports:
      - "6379:6379"

  minio:
    image: minio/minio
    container_name: vibedate-minio
    command: server /data --console-address ":9001"
    restart: always
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9002:9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc
    container_name: vibedate-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb -p local/vibedate-photos || true;
      exit 0;
      "

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: vibedate-rabbitmq
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"

  celery-worker:
    build: .
    container_name: vibedate-celery-worker
    restart: always
    env_file: .env
    command: celery -A app.celery_app:celery_app worker -l INFO
    depends_on:
      - db
      - redis
    volumes:
      - .:/workspace

  celery-beat:
    build: .
    container_name: vibedate-celery-beat
    restart: always
    env_file: .env
    command: celery -A app.celery_app:celery_app beat -l INFO
    depends_on:
      - redis
    volumes:
      - .:/workspace

  app:
    build: .
    container_name: vibedate-app
    restart: always
    env_file: .env
    ports:
      - "9100:9100"
    depends_on:
      - db
      - redis
      - minio
      - rabbitmq
    volumes:
      - .:/workspace
    command: python -m app.main

volumes:
  postgres_data:
  minio_data:
