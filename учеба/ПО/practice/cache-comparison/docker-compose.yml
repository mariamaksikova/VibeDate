services:
  redis:
    image: redis:7-alpine
    ports:
      # 6380 на хосте, если 6379 уже занят другим Redis
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bench
      POSTGRES_PASSWORD: bench
      POSTGRES_DB: cachebench
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bench -d cachebench"]
      interval: 2s
      timeout: 3s
      retries: 15
